<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>GeoGame — Fog of War MVP</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #080d12;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        
const MAX_INVENTORY_WEIGHT = 35.0;
const MAX_INVENTORY_VOLUME = 80.0;


let nonCriticalPositionTimer = null;

function queueNonCriticalPositionSystems(position, speedKmh) {
    if (!position || !position.coords) return;

    const fix = {
        coords: {
            latitude: Number(position.coords.latitude),
            longitude: Number(position.coords.longitude),
            accuracy: Number(position.coords.accuracy),
            speed: position.coords.speed == null ? null : Number(position.coords.speed)
        },
        timestamp: Number(position.timestamp) || Date.now()
    };

    if (!Number.isFinite(fix.coords.latitude) || !Number.isFinite(fix.coords.longitude)) return;

    if (nonCriticalPositionTimer) clearTimeout(nonCriticalPositionTimer);
    nonCriticalPositionTimer = setTimeout(() => {
        nonCriticalPositionTimer = null;

        // Every subsystem is isolated: one failure cannot break GPS/map updates.
        try { consumeCarFuelByGps(fix, Number(speedKmh) || 0); } catch (e) {
            console.warn("Car fuel subsystem:", e);
        }

        try {
            if (typeof refreshNearbyTrees === "function") {
                refreshNearbyTrees(fix.coords.latitude, fix.coords.longitude);
            }
        } catch (e) {
            console.warn("Tree subsystem:", e);
        }

        try {
            if (typeof refreshNearbyWater === "function") {
                refreshNearbyWater(fix.coords.latitude, fix.coords.longitude);
            }
        } catch (e) {
            console.warn("Water subsystem:", e);
        }
    }, 0);
}

</script>


<div id="buildingLootModal" aria-hidden="true">
    <div class="building-loot-panel">
        <div class="building-loot-head">
            <div>
                <h2>🔍 Результат обшуку</h2>
                <div style="opacity:.72;font-size:13px;margin-top:3px;">Знайдені речі в будівлі</div>
            </div>
            <button id="closeBuildingLoot" class="loot-close">Закрити</button>
        </div>
        <div id="buildingLootGrid"></div>
        <div id="buildingLootMessage"></div>
        <button id="takeAllBuildingLoot">🎒 Забрати все</button>
    </div>
</div>


<div id="emergencyUnloadModal" class="modal emergency-unload-modal">
    <div class="modal-content emergency-unload-content">
        <h2>⛽ Пальне закінчилось</h2>
        <p id="strandedUnloadHint">Машина залишається тут. Обери, що взяти з собою в рюкзак, а що залишити в машині.</p>
        <div id="strandedLoadSummary"></div>

        <div class="transfer-heading">🚗 Машина</div>
        <div id="strandedCarGrid" class="building-loot-grid"></div>

        <div class="transfer-heading">🎒 З собою</div>
        <div id="strandedBackpackGrid" class="building-loot-grid"></div>

        <button id="recoverStrandedCar" type="button" onclick="tryRecoverStrandedCar()">🚗 Поїхати на машині</button>
        <button id="finishEmergencyUnload" type="button" onclick="closeEmergencyUnload()">🎒 Взяти рюкзак і йти пішки</button>
    </div>
</div>
</body>
</html>
