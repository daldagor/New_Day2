<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>GeoGame — Fog of War MVP</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #080d12;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* =========================
           MAP
        ========================== */

        #map {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        /* =========================
           FOG CANVAS
        ========================== */

        #fogCanvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 500;

            pointer-events: none;
        }

        /* =========================
           GAME HUD
        ========================== */

        #gameUI {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 1200;

            padding:
                calc(10px + env(safe-area-inset-top))
                12px
                10px;

            color: white;

            background:
                linear-gradient(
                    to bottom,
                    rgba(7, 12, 18, 0.96),
                    rgba(7, 12, 18, 0.76)
                );

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-bottom:
                1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 5px 20px rgba(0,0,0,0.35);
        }

        .hud-main {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .player-info {
            min-width: 0;
        }

        .player-name {
            font-size: 15px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hp-row {
            margin-top: 4px;

            font-size: 12px;

            color: #cbd6df;
        }

        .hp-bar {
            width: 100px;
            height: 5px;

            margin-top: 4px;

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.16);
        }

        .hp-fill {
            width: 100%;
            height: 100%;

            background: #48df79;
        }

        .speed-box {
            text-align: right;
            white-space: nowrap;
        }

        #speed {
            font-size: 23px;
            font-weight: 900;
        }

        .speed-unit {
            font-size: 10px;

            color: #aab7c3;
        }

        /* =========================
           SECOND HUD ROW
        ========================== */

        .hud-controls {
            display: flex;

            align-items: center;

            gap: 7px;

            margin-top: 9px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .hud-controls::-webkit-scrollbar {
            display: none;
        }

        .hud-chip,
        .hud-button {
            flex: 0 0 auto;

            border:
                1px solid rgba(255,255,255,0.15);

            border-radius: 10px;

            padding: 7px 10px;

            color: white;

            background:
                rgba(255,255,255,0.09);

            font-size: 11px;
            font-weight: 700;
        }

        .hud-button {
            cursor: pointer;
        }

        .hud-button:active {
            transform: scale(0.96);
        }

        #flashlightButton.active {
            background:
                rgba(255, 211, 77, 0.22);

            border-color:
                rgba(255, 211, 77, 0.55);

            color: #ffe58b;
        }

        #biomeButton.field {
            background:
                rgba(77, 199, 110, 0.20);

            border-color:
                rgba(77, 199, 110, 0.45);
        }

        /* =========================
           PLAYER MARKER
        ========================== */

        .player-marker-wrapper {
            position: relative;

            width: 24px;
            height: 24px;
        }

        .player-marker {
            position: absolute;

            left: 0;
            top: 0;

            width: 24px;
            height: 24px;

            border-radius: 50%;

            background: #168cff;

            border: 4px solid white;

            box-shadow:
                0 0 0 6px rgba(22,140,255,0.22),
                0 3px 10px rgba(0,0,0,0.55);

            z-index: 2;
        }

        .player-pulse {
            position: absolute;

            left: -10px;
            top: -10px;

            width: 44px;
            height: 44px;

            border-radius: 50%;

            background:
                rgba(22,140,255,0.27);

            animation:
                playerPulse 2s infinite;
        }

        @keyframes playerPulse {

            0% {
                transform: scale(0.5);
                opacity: 1;
            }

            100% {
                transform: scale(1.7);
                opacity: 0;
            }

        }

        /* =========================
           COMPASS / CENTER BUTTON
        ========================== */

        #centerButton {
            position: fixed;
            right: 18px;
            bottom: calc(24px + env(safe-area-inset-bottom));
            z-index: 1500;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(10,16,23,0.94);
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(0,0,0,0.50);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #centerButton:active {
            transform: scale(0.90);
        }

        /* =========================
           GPS STATUS
        ========================== */

        #gpsStatus {
            position: fixed;

            left: 50%;

            bottom:
                calc(
                    20px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            z-index: 1300;

            padding: 9px 14px;

            border-radius: 20px;

            color: white;

            background:
                rgba(8,13,19,0.88);

            backdrop-filter: blur(8px);

            font-size: 12px;

            white-space: nowrap;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.35);
        }

        /* =========================
           LOGIN
        ========================== */

        #loginScreen {
            position: fixed;
            inset: 0;

            z-index: 5000;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 24px;

            background:

                radial-gradient(
                    circle at 30% 20%,
                    #23466b 0%,
                    transparent 40%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    #102d48 0%,
                    transparent 40%
                ),

                linear-gradient(
                    145deg,
                    #07111d,
                    #101b28
                );
        }

        .login-card {
            width: 100%;
            max-width: 390px;

            padding: 38px 26px 30px;

            text-align: center;

            color: white;

            border-radius: 26px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.14);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.45);
        }

        .game-logo {
            width: 78px;
            height: 78px;

            margin:
                0 auto 20px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    #168cff,
                    #00d0ff
                );

            font-size: 38px;

            box-shadow:
                0 12px 30px
                rgba(0,140,255,0.35);
        }

        .login-card h1 {
            font-size: 30px;

            margin-bottom: 10px;
        }

        .login-card p {
            margin-bottom: 30px;

            color: #b9c6d3;

            font-size: 14px;

            line-height: 1.5;
        }

        #googleLogin {
            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 16px;

            background: white;

            color: #222;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;
        }

        .prototype-note {
            margin-top: 18px !important;
            margin-bottom: 0 !important;

            font-size: 11px !important;

            color: #718091 !important;
        }

        /* =========================
           INVENTORY
        ========================== */

        #inventoryModal {
            position: fixed; inset: 0; z-index: 4000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; background: rgba(0,0,0,0.72);
        }
        .inventory-card {
            width: min(430px, 100%); max-height: 82vh; overflow: auto;
            padding: 20px; border-radius: 18px; color: white;
            background: rgba(10,16,23,0.97);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
        }
        .inventory-header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .inventory-header h2 { font-size: 21px; }
        .inventory-summary { margin: 16px 0; font-size: 14px; font-weight: 800; }
        .capacity-label { display:flex; justify-content:space-between; margin:10px 0 5px; font-size:12px; color:#cbd6df; }
        .capacity-bar { height:8px; overflow:hidden; border-radius:10px; background:rgba(255,255,255,.12); }
        .capacity-fill { height:100%; width:0%; background:#48df79; transition:width .2s; }
        #inventoryItems { margin-top:16px; display:grid; gap:9px; }
        .inventory-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10); }
        .inventory-icon { font-size:28px; }
        .inventory-item-name { font-weight:800; font-size:14px; }
        .inventory-item-stats { margin-top:3px; color:#b9c6d3; font-size:12px; }
        #closeInventory { margin-top:18px; width:100%; padding:12px; border:0; border-radius:11px; font-weight:800; cursor:pointer; }

        #chopWoodButton.unavailable { opacity: .48; filter: grayscale(.35); }
        #gameMessage {
            position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
            z-index: 5000; width: min(420px, calc(100% - 32px)); padding: 13px 16px;
            border-radius: 12px; color: white; text-align: center; font-size: 13px; font-weight: 800;
            background: rgba(24,34,44,.96); border: 1px solid rgba(255,255,255,.16);
            box-shadow: 0 8px 28px rgba(0,0,0,.45); pointer-events: none;
        }
        #gameMessage.error { background: rgba(135,25,25,.97); border-color: rgba(255,120,120,.55); }
        #gameMessage.success { background: rgba(22,105,58,.97); border-color: rgba(100,230,145,.5); }

        .hidden {
            display: none !important;
        }

        /*
            Leaflet controls lower
            because HUD occupies top.
        */

        .leaflet-top {
            top: 125px;
        }



        /* BUILDING POPUPS */
        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip { background: rgba(10,16,23,.97); color:#fff; }
        .leaflet-popup-content { margin:14px 16px; min-width:210px; }
        .building-popup { font-family: Arial, sans-serif; }
        .building-popup-title { font-weight:900; font-size:15px; margin-bottom:10px; }
        .building-popup-distance { color:#b9c6d3; font-size:12px; margin-bottom:10px; }
        .building-popup-actions { display:grid; gap:8px; }
        .building-action {
            width:100%; border:1px solid rgba(255,255,255,.18); border-radius:10px;
            padding:10px 12px; background:rgba(255,255,255,.11); color:#fff;
            font-weight:800; cursor:pointer;
        }
        .building-action.capture { background:rgba(56,180,105,.22); border-color:rgba(56,180,105,.55); }
        .building-action.search { background:rgba(45,133,255,.22); border-color:rgba(45,133,255,.55); }
        .building-action.storage { background:rgba(56,180,105,.30); border-color:rgba(56,180,105,.70); }
        .building-action:disabled { opacity:.38; cursor:not-allowed; }
        .building-popup-warning { margin-top:9px; color:#ff6868; font-size:12px; font-weight:800; line-height:1.35; }
        .building-popup-ok { color:#76dc98; font-size:12px; margin-top:8px; }

    </style>
</head>

<body>

    <!-- MAP -->

    <div id="map"></div>


    <!--
        Canvas is ABOVE map but BELOW HUD.

        All fog rendering happens here.
    -->

    <canvas id="fogCanvas"></canvas>


    <!-- GAME HUD -->

    <div
        id="gameUI"
        class="hidden"
    >

        <div class="hud-main">

            <div class="player-info">

                <div class="player-name">
                    Gamer_Gmail
                </div>

                <div class="hp-row">
                    HP:
                    <span id="hp">
                        100
                    </span>
                </div>

                <div class="hp-bar">
                    <div class="hp-fill"></div>
                </div>

            </div>


            <div class="speed-box">

                <div id="speed">
                    0.0
                </div>

                <div class="speed-unit">
                    км/год
                </div>

            </div>

        </div>


        <div class="hud-controls">

            <div
                id="timeMode"
                class="hud-chip"
            >
                ☀️ День
            </div>


            <div
                id="biomeButton"
                class="hud-chip"
            >
                🛰 Визначення місцевості...
            </div>


            <div
                id="visionInfo"
                class="hud-chip"
            >
                Поточний огляд: 50 м
            </div>


            <button
                id="flashlightButton"
                class="hud-button"
            >
                🔦 Увімкнути
            </button>

            <div id="inventoryStatus" class="hud-chip">
                Рюкзак: 2.0 / 35.0 кг (0 / 80 л)
            </div>

            <button id="inventoryButton" class="hud-button">
                🎒 Рюкзак
            </button>

            <button id="chopWoodButton" class="hud-button unavailable">
                🪓 Рубати дрова
            </button>

        </div>

    </div>


    <!-- COMPASS: CENTER MAP ON CURRENT GPS POSITION -->

    <button
        id="centerButton"
        class="hidden"
        title="Повернутися до моєї позиції"
        aria-label="Повернутися до моєї позиції"
    >
        🧭
    </button>


    <!-- GPS STATUS -->

    <div
        id="gpsStatus"
        class="hidden"
    >
        Пошук GPS...
    </div>


    <!-- INVENTORY MODAL -->
    <div id="inventoryModal" class="hidden">
        <div class="inventory-card">
            <div class="inventory-header">
                <h2>🎒 Рюкзак</h2>
            </div>
            <div id="inventorySummary" class="inventory-summary"></div>
            <div class="capacity-label"><span>Вага</span><span id="weightText"></span></div>
            <div class="capacity-bar"><div id="weightFill" class="capacity-fill"></div></div>
            <div class="capacity-label"><span>Об'єм</span><span id="volumeText"></span></div>
            <div class="capacity-bar"><div id="volumeFill" class="capacity-fill"></div></div>
            <div id="inventoryItems"></div>
            <button id="closeInventory">Закрити</button>
        </div>
    </div>

    <!-- GAME MESSAGE -->
    <div id="gameMessage" class="hidden"></div>

    <!-- LOGIN -->

    <div id="loginScreen">

        <div class="login-card">

            <div class="game-logo">
                🌍
            </div>

            <h1>
                GEO WORLD
            </h1>

            <p>
                Досліджуй реальний світ.<br>
                Відкривай території та
                розсіюй туман війни.
            </p>

            <button id="googleLogin">
                Увійти через Google (Gmail)
            </button>

            <p class="prototype-note">
                MVP — тестова авторизація
                без сервера
            </p>

        </div>

    </div>


    <!-- Leaflet JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


<script>

/* =========================================================
   INVENTORY
========================================================= */
const MAX_INVENTORY_WEIGHT = 35.0;
const MAX_INVENTORY_VOLUME = 80.0;
const INVENTORY_STORAGE_KEY = "geoGameInventory";

const STARTER_AXE = {
    id: "scout_axe", name: "Сокира розвідника", icon: "🪓",
    weight: 2.0, volume: 0, external: true
};

const FIREWOOD_BUNDLE = {
    id: "firewood_bundle", name: "В'язанка дров", icon: "🪵",
    weight: 10.0, volume: 15.0, external: false
};

let inventory = [];

function loadInventory() {
    try {
        const saved = JSON.parse(localStorage.getItem(INVENTORY_STORAGE_KEY) || "[]");
        inventory = Array.isArray(saved) ? saved : [];
    } catch (_) { inventory = []; }
    if (!inventory.some(item => item.id === STARTER_AXE.id)) {
        inventory.unshift({...STARTER_AXE});
        saveInventory();
    }
}

function saveInventory() {
    localStorage.setItem(INVENTORY_STORAGE_KEY, JSON.stringify(inventory));
}

function getInventoryWeight() {
    return inventory.reduce((sum, item) => sum + Number(item.weight || 0), 0);
}

function getInventoryVolume() {
    return inventory.reduce((sum, item) => sum + (item.external ? 0 : Number(item.volume || 0)), 0);
}

function canAddItem(weight, volume) {
    const w = Number(weight), v = Number(volume);
    if (!Number.isFinite(w) || !Number.isFinite(v) || w < 0 || v < 0) return false;
    return getInventoryWeight() + w <= MAX_INVENTORY_WEIGHT &&
           getInventoryVolume() + v <= MAX_INVENTORY_VOLUME;
}

function addItem(item) {
    const volume = item.external ? 0 : Number(item.volume || 0);
    if (!canAddItem(item.weight, volume)) return false;
    inventory.push(item);
    saveInventory();
    updateInventoryUI();
    return true;
}

function formatLiters(value) {
    return Number.isInteger(value) ? String(value) : value.toFixed(1);
}

function updateInventoryUI() {
    const weight = getInventoryWeight();
    const volume = getInventoryVolume();
    const status = `Рюкзак: ${weight.toFixed(1)} / ${MAX_INVENTORY_WEIGHT.toFixed(1)} кг (${formatLiters(volume)} / ${formatLiters(MAX_INVENTORY_VOLUME)} л)`;
    document.getElementById("inventoryStatus").textContent = status;
    document.getElementById("inventorySummary").textContent = status;
    document.getElementById("weightText").textContent = `${weight.toFixed(1)} / ${MAX_INVENTORY_WEIGHT.toFixed(1)} кг`;
    document.getElementById("volumeText").textContent = `${formatLiters(volume)} / ${formatLiters(MAX_INVENTORY_VOLUME)} л`;
    document.getElementById("weightFill").style.width = `${Math.min(100, weight / MAX_INVENTORY_WEIGHT * 100)}%`;
    document.getElementById("volumeFill").style.width = `${Math.min(100, volume / MAX_INVENTORY_VOLUME * 100)}%`;
    const list = document.getElementById("inventoryItems");
    list.innerHTML = "";
    inventory.forEach(item => {
        const row = document.createElement("div"); row.className = "inventory-item";
        const icon = document.createElement("div"); icon.className = "inventory-icon"; icon.textContent = item.icon || "📦";
        const info = document.createElement("div");
        const name = document.createElement("div"); name.className = "inventory-item-name"; name.textContent = item.name;
        const stats = document.createElement("div"); stats.className = "inventory-item-stats";
        stats.textContent = `${Number(item.weight).toFixed(1)} кг / ${formatLiters(item.external ? 0 : Number(item.volume || 0))} л${item.external ? " · зовнішнє кріплення" : ""}`;
        info.append(name, stats); row.append(icon, info); list.appendChild(row);
    });
}

document.getElementById("inventoryButton").addEventListener("click", () => {
    updateInventoryUI();
    document.getElementById("inventoryModal").classList.remove("hidden");
});
document.getElementById("closeInventory").addEventListener("click", () => {
    document.getElementById("inventoryModal").classList.add("hidden");
});
document.getElementById("inventoryModal").addEventListener("click", e => {
    if (e.target.id === "inventoryModal") e.currentTarget.classList.add("hidden");
});

let gameMessageTimer = null;
function showGameMessage(message, type = "") {
    const box = document.getElementById("gameMessage");
    box.textContent = message;
    box.className = type || "";
    clearTimeout(gameMessageTimer);
    gameMessageTimer = setTimeout(() => box.classList.add("hidden"), 3000);
}

function hasScoutAxe() {
    return inventory.some(item => item.id === STARTER_AXE.id);
}

function chopWood() {
    if (currentBiome !== "field") {
        showGameMessage("Тут немає дерев! Перейдіть у лісову зону (режим Поле)", "error");
        return;
    }

    if (!hasScoutAxe()) {
        showGameMessage("Для рубання дров потрібна Сокира розвідника!", "error");
        return;
    }

    if (!canAddItem(FIREWOOD_BUNDLE.weight, FIREWOOD_BUNDLE.volume)) {
        showGameMessage("Немає місця в рюкзаку! Спробуйте вивантажити ресурси", "error");
        return;
    }

    addItem({...FIREWOOD_BUNDLE, uid: Date.now()});
    showGameMessage("+1 В'язанка дров (10.0 кг / 15 л)", "success");
}

document.getElementById("chopWoodButton").addEventListener("click", chopWood);

loadInventory();
updateInventoryUI();

/* =========================================================
   STORAGE
========================================================= */

const LOGIN_STORAGE_KEY =
    "geoGameLoggedIn";

const EXPLORED_STORAGE_KEY =
    "geoGameExploredZones";

const FLASHLIGHT_STORAGE_KEY =
    "geoGameFlashlight";

const BIOME_STORAGE_KEY =
    "geoGameBiome";


/* =========================================================
   GAME STATE
========================================================= */

let map = null;

let playerMarker = null;

let accuracyCircle = null;

let firstGPSPosition = true;

let previousPosition = null;

let currentPosition = null;

let watchId = null;


/*
    Previously explored areas.

    Each object:

    {
        lat: number,
        lng: number,
        radius: number
    }
*/

let exploredZones = [];


/*
    Biome MVP.

    "city"
    "field"
*/

let currentBiome =
    localStorage.getItem(
        BIOME_STORAGE_KEY
    ) || "city";

/*
    Automatic biome detection state.
    We query OpenStreetMap via Overpass only after
    the player moves far enough, not on every GPS tick.
*/
let lastBiomeCheckPosition = null;
let biomeCheckInProgress = false;
const BIOME_CHECK_DISTANCE = 75;
const BIOME_SEARCH_RADIUS = 120;


/* =========================================================
   REAL OSM BUILDINGS / INTERACTION
========================================================= */
const BUILDING_STATE_STORAGE_KEY = "geoGameBuildingStatesV1";
const BASE_BACKUP_STORAGE_KEY = "geoGameMainBaseV1";
const BUILDING_INTERACTION_RADIUS = 20;
const BASE_PROTECTION_RADIUS = 200;
let buildingLayer = null;
let buildingStates = {};
let buildingLoadTimer = null;
let buildingRequestController = null;
let openBuildingRecord = null;

try {
    buildingStates = JSON.parse(localStorage.getItem(BUILDING_STATE_STORAGE_KEY) || "{}") || {};
} catch (_) {
    buildingStates = {};
}

function handlePosition(

) {

    const latitude =
        position.coords.latitude;

    const longitude =

    const accuracy =
        position.coords.accuracy;


    currentPosition = {

        lat: latitude,

                }
            )
            .addTo(map);

    }
    else {

        playerMarker
            .setLatLng(
                latLng
            );

    }


    /*
        GPS ACCURACY
    */

    if (!accuracyCircle) {

        accuracyCircle =
            L.circle(
                latLng,
                {

                    radius:
                        accuracy,

                    weight:
                        1,

                    color:
                        "#168cff",

                    fillColor:
                        "#168cff",

                    opacity:
                        0.35,

                    fillOpacity:
                        0.05

                }
            )
            .addTo(map);

    }
    else {

        accuracyCircle
            .setLatLng(
                latLng
            );

        accuracyCircle
            .setRadius(
                accuracy
            );

    }


    /*
        MAP FOLLOW
    */

    if (firstGPSPosition) {

        map.setView(
            latLng,
            18
        );

        firstGPSPosition =
            false;

    }

    /*
        Після першого GPS-фіксу камера більше
        не рухається автоматично. Карту можна
        вільно гортати. Для повернення до себе
        використовується кнопка компаса.
    */


    /*
        SPEED
    */

    const speed =
        calculateSpeed(
            position
        );

    speedElement.textContent =
        speed.toFixed(1);


    /*
        AUTOMATIC BIOME DETECTION
    */

    updateBiomeFromPosition(
        latitude,
        longitude
    );


    /*
        VISION
    */

    const radius =
        getCurrentVisionRadius();


    /*

        latitude,

        radius
    );


    /*

    drawFog();

    updateHUD();

}

function scheduleBuildingLoad() {
    clearTimeout(buildingLoadTimer);
    buildingLoadTimer = setTimeout(loadVisibleBuildings, 450);
}

async function loadVisibleBuildings() {
    if (!map || map.getZoom() < 16) {
        if (buildingLayer) {
            buildingLayer.clearLayers();
            renderSavedBaseBackup();
        }
        return;
    }

    const b = map.getBounds();
    const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].join(",");
    const query = `[out:json][timeout:18];(way["building"](${bbox});relation["building"](${bbox}););out geom;`;

    if (buildingRequestController) buildingRequestController.abort();
    buildingRequestController = new AbortController();

    try {
        const endpoints = [
            "https://overpass-api.de/api/interpreter",
            "https://overpass.kumi.systems/api/interpreter"
        ];
        let data = null;
        let lastError = null;

        for (const endpoint of endpoints) {
            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
                    body: "data=" + encodeURIComponent(query),
                    signal: buildingRequestController.signal
                });
                if (!response.ok) throw new Error("Overpass HTTP " + response.status);
                data = await response.json();
                break;
            } catch (error) {
                if (error.name === "AbortError") throw error;
                lastError = error;
            }
        }

        if (!data) throw lastError || new Error("Overpass недоступний");
        renderOSMBuildings(data.elements || []);
    } catch (error) {
        if (error.name !== "AbortError") {
            console.warn("Не вдалося завантажити будівлі OSM:", error);
            renderSavedBaseBackup();
            showGameMessage("Не вдалося оновити будівлі. Перевірте інтернет і спробуйте ще раз.", "error");
        }
    }
}

function renderOSMBuildings(elements) {
    if (!buildingLayer) return;
    buildingLayer.clearLayers();

    elements.forEach(el => {
        const rings = [];
        if (el.type === "way" && Array.isArray(el.geometry) && el.geometry.length >= 3) {
            rings.push(el.geometry.map(p => [p.lat, p.lon]));
        } else if (el.type === "relation" && Array.isArray(el.members)) {
            el.members.forEach(m => {
                if ((m.role === "outer" || !m.role) && Array.isArray(m.geometry) && m.geometry.length >= 3) {
                    rings.push(m.geometry.map(p => [p.lat, p.lon]));
                }
            });
        }

        rings.forEach((ring, index) => {
            const buildingId = `${el.type}/${el.id}${rings.length > 1 ? "/" + index : ""}`;
            const state = buildingStates[buildingId] || {};
            const polygon = L.polygon(ring, getBuildingStyle(state));
            const record = { id: buildingId, ring, polygon };
            polygon._buildingRecord = record;
            polygon.bindPopup(() => buildBuildingPopup(record), { closeButton:true, autoPan:true });
            polygon.on("popupopen", () => { openBuildingRecord = record; refreshOpenBuildingPopup(); });
            polygon.on("popupclose", () => { if (openBuildingRecord === record) openBuildingRecord = null; });
            polygon.addTo(buildingLayer);
        });
    });

    renderSavedBaseBackup();
}

function loadBaseBackup() {
    try {
        return JSON.parse(localStorage.getItem(BASE_BACKUP_STORAGE_KEY) || "null");
    } catch (_) {
        return null;
    }
}

function saveBaseBackup(record) {
    const center = record.polygon.getBounds().getCenter();
    localStorage.setItem(BASE_BACKUP_STORAGE_KEY, JSON.stringify({
        id: record.id,
        ring: record.ring,
        lat: center.lat,
        lng: center.lng
    }));
}

function renderSavedBaseBackup() {
    if (!buildingLayer) return;
    const backup = loadBaseBackup();
    if (!backup || !Array.isArray(backup.ring) || backup.ring.length < 3) return;

    let alreadyRendered = false;
    buildingLayer.eachLayer(layer => {
        if (layer._buildingRecord && layer._buildingRecord.id === backup.id) alreadyRendered = true;
    });
    if (alreadyRendered) return;

    buildingStates[backup.id] = { ...(buildingStates[backup.id] || {}), isBase:true, isDepleted:false };
    const polygon = L.polygon(backup.ring, getBuildingStyle(buildingStates[backup.id]));
    const record = { id: backup.id, ring: backup.ring, polygon };
    polygon._buildingRecord = record;
    polygon.bindPopup(() => buildBuildingPopup(record), { closeButton:true, autoPan:true });
    polygon.on("popupopen", () => { openBuildingRecord = record; refreshOpenBuildingPopup(); });
    polygon.on("popupclose", () => { if (openBuildingRecord === record) openBuildingRecord = null; });
    polygon.addTo(buildingLayer);
}

function getBuildingStyle(state) {
    if (state.isBase) {
        return { color:"#45d477", weight:2, fillColor:"#2cb55d", fillOpacity:.42 };
    }
    if (state.isDepleted) {
        return { color:"#9aa5af", weight:1, fillColor:"#6f7b86", fillOpacity:.22 };
    }
    return { color:"#d8dee5", weight:1, fillColor:"#9aa6b2", fillOpacity:.18 };
}

function pointInRing(lat, lng, ring) {
    let inside = false;
    for (let i=0, j=ring.length-1; i<ring.length; j=i++) {
        const yi=ring[i][0], xi=ring[i][1], yj=ring[j][0], xj=ring[j][1];
        const hit = ((yi > lat) !== (yj > lat)) &&
            (lng < (xj-xi) * (lat-yi) / ((yj-yi) || 1e-12) + xi);
        if (hit) inside = !inside;
    }
    return inside;
}

/* Closest point on each polygon edge, then Haversine to that point. */
function distanceToBuilding(lat, lng, ring) {
    if (!ring || !ring.length) return Infinity;
    if (pointInRing(lat, lng, ring)) return 0;

    const lat0 = lat * Math.PI / 180;
    const metersPerDegLat = 111320;
    const metersPerDegLng = 111320 * Math.cos(lat0);
    let best = Infinity;

    for (let i=0; i<ring.length; i++) {
        const a = ring[i], b = ring[(i+1) % ring.length];
        const ax=(a[1]-lng)*metersPerDegLng, ay=(a[0]-lat)*metersPerDegLat;
        const bx=(b[1]-lng)*metersPerDegLng, by=(b[0]-lat)*metersPerDegLat;
        const dx=bx-ax, dy=by-ay;
        const denom=dx*dx+dy*dy;
        let t = denom ? -(ax*dx+ay*dy)/denom : 0;
        t = Math.max(0, Math.min(1, t));
        const nearLat = a[0] + (b[0]-a[0])*t;
        const nearLng = a[1] + (b[1]-a[1])*t;
        best = Math.min(best, getDistance(lat, lng, nearLat, nearLng));
    }
    return best;
}

function getBuildingDistance(record) {
    if (!currentPosition) return Infinity;
    return distanceToBuilding(currentPosition.lat, currentPosition.lng, record.ring);
}

function buildBuildingPopup(record) {
    const state = buildingStates[record.id] || {};
    const distance = getBuildingDistance(record);
    const root = document.createElement("div");
    root.className = "building-popup";

    const title = document.createElement("div");
    title.className = "building-popup-title";
    title.textContent = state.isBase ? "🏠 Твоя Головна База" : state.isDepleted ? "📭 Будівля порожня" : "Об'єкт: Будівля";
    root.appendChild(title);

    const distanceEl = document.createElement("div");
    distanceEl.className = "building-popup-distance";
    distanceEl.textContent = Number.isFinite(distance) ? `Відстань: ${Math.round(distance)} м` : "Очікування GPS-позиції…";
    root.appendChild(distanceEl);

    const actions = document.createElement("div");
    actions.className = "building-popup-actions";
    root.appendChild(actions);

    if (state.isBase) {
        const allowed = distance <= BASE_PROTECTION_RADIUS;
        const btn = popupButton("📦 Склад Бази", "storage", !allowed, () => openBaseStorage(record));
        actions.appendChild(btn);
        if (!allowed) addPopupWarning(root, Number.isFinite(distance) ? "Потрібно увійти в зону захисту" : "Потрібно визначити GPS-позицію");
    } else if (!state.isDepleted) {
        const allowed = distance < BUILDING_INTERACTION_RADIUS;
        actions.appendChild(popupButton("🔍 Обшукати", "search", !allowed, () => searchBuilding(record)));
        actions.appendChild(popupButton("🛡️ Захопити", "capture", !allowed, () => captureBuilding(record)));
        if (!allowed) {
            const extra = Number.isFinite(distance) ? Math.max(1, Math.ceil(distance - BUILDING_INTERACTION_RADIUS)) : null;
            addPopupWarning(root, extra === null ? "Потрібно визначити GPS-позицію" : `Занадто далеко. Підійдіть ближче на ${extra} метрів`);
        }
    }
    return root;
}

function popupButton(text, kind, disabled, handler) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = `building-action ${kind}`;
    btn.textContent = text;
    btn.disabled = disabled;
    btn.addEventListener("click", e => { e.stopPropagation(); if (!btn.disabled) handler(); });
    return btn;
}

function addPopupWarning(root, text) {
    const warning = document.createElement("div");
    warning.className = "building-popup-warning";
    warning.textContent = text;
    root.appendChild(warning);
}

function refreshOpenBuildingPopup() {
    if (!openBuildingRecord || !openBuildingRecord.polygon || !openBuildingRecord.polygon.isPopupOpen()) return;
    openBuildingRecord.polygon.setPopupContent(buildBuildingPopup(openBuildingRecord));
}

function searchBuilding(record) {
    if (getBuildingDistance(record) >= BUILDING_INTERACTION_RADIUS) return refreshOpenBuildingPopup();
    const state = buildingStates[record.id] || {};
    if (state.isBase || state.isDepleted) return;
    state.isDepleted = true;
    buildingStates[record.id] = state;
    saveBuildingStates();
    record.polygon.setStyle(getBuildingStyle(state));
    record.polygon.setPopupContent(buildBuildingPopup(record));
}

function captureBuilding(record) {
    if (getBuildingDistance(record) >= BUILDING_INTERACTION_RADIUS) return refreshOpenBuildingPopup();

    /* Only one building is the player's Main Base. */
    Object.keys(buildingStates).forEach(id => {
        if (buildingStates[id] && buildingStates[id].isBase) buildingStates[id].isBase = false;
    });
    buildingStates[record.id] = { ...(buildingStates[record.id] || {}), isBase:true, isDepleted:false };
    saveBuildingStates();
    saveBaseBackup(record);

    /* Refresh styles of currently rendered buildings. */
    buildingLayer.eachLayer(layer => {
        if (!layer.getLatLngs) return;
    });
    record.polygon.setStyle(getBuildingStyle(buildingStates[record.id]));
    record.polygon.setPopupContent(buildBuildingPopup(record));
    scheduleBuildingLoad();
}

function openBaseStorage(record) {
    if (getBuildingDistance(record) > BASE_PROTECTION_RADIUS) return refreshOpenBuildingPopup();
    const weight = getInventoryWeight().toFixed(1);
    const volume = formatLiters(getInventoryVolume());
    gpsStatus.textContent = `📦 Склад Бази доступний · Рюкзак ${weight}/${MAX_INVENTORY_WEIGHT.toFixed(1)} кг · ${volume}/${formatLiters(MAX_INVENTORY_VOLUME)} л`;
}

/* =========================================================
   AUTOMATIC BIOME DETECTION — OPENSTREETMAP / OVERPASS
========================================================= */

async function updateBiomeFromPosition(lat, lng) {

    if (biomeCheckInProgress) {
        return;
    }

    if (lastBiomeCheckPosition) {
        const moved = getDistance(
            lastBiomeCheckPosition.lat,
            lastBiomeCheckPosition.lng,
            lat,
            lng
        );

        if (moved < BIOME_CHECK_DISTANCE) {
            return;
        }
    }

    biomeCheckInProgress = true;
    biomeButton.textContent = "🛰 Визначення місцевості...";

    try {
        const query = `[out:json][timeout:10];(
          nwr(around:${BIOME_SEARCH_RADIUS},${lat},${lng})[building];
          nwr(around:${BIOME_SEARCH_RADIUS},${lat},${lng})[landuse~"residential|commercial|industrial|retail|construction"];
          nwr(around:${BIOME_SEARCH_RADIUS},${lat},${lng})[place~"city|town|suburb|neighbourhood|quarter"];
        );out tags qt;`;

        const response = await fetch(
            "https://overpass-api.de/api/interpreter",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body: "data=" + encodeURIComponent(query)
            }
        );

        if (!response.ok) {
            throw new Error("Overpass HTTP " + response.status);
        }

        const data = await response.json();
        const detectedBiome =
            data.elements && data.elements.length > 0
                ? "city"
                : "field";

        const biomeChanged = detectedBiome !== currentBiome;
        currentBiome = detectedBiome;

        localStorage.setItem(
            BIOME_STORAGE_KEY,
            currentBiome
        );

        lastBiomeCheckPosition = { lat, lng };

        /*
            If biome changes, redraw immediately and save
            the new visibility circle without closing any
            previously explored territory.
        */
        if (biomeChanged && currentPosition) {
            saveExploredPointIfNeeded(
                currentPosition.lat,
                currentPosition.lng,
                getCurrentVisionRadius(),
                true
            );
        }

        updateHUD();
        drawFog();

    }
    catch (error) {
        console.warn(
            "Не вдалося автоматично визначити біом:",
            error
        );

        /*
            On network/API failure keep the last known biome.
        */
        updateHUD();
    }
    finally {
        biomeCheckInProgress = false;
    }
}

        currentBiome ===

    ) {

            );

    else {

        biomeButton

            .add(
                "field"
            );

    }


    /*
        VISION
    */

        "Поточний огляд: " +
        radius +
        " м";

        FLASHLIGHT
    */

        flashlightButton
            .classList

                "active"
            );

    }

    }

}


/* =========================================================
   EXPLORED ZONES
========================================================= */

function loadExploredZones() {

    try {

        const saved =
            localStorage.getItem(
                EXPLORED_STORAGE_KEY
            );

        if (!saved) {

            exploredZones = [];

            return;

        }


        const parsed =
            JSON.parse(
                saved
            );


        if (
            Array.isArray(
                parsed
            )
        ) {

            exploredZones =
                parsed;

        }

    }
    catch (error) {

        console.error(
            "Помилка завантаження Fog of War:",
            error
        );

        exploredZones = [];

    }

}


/* =========================================================
   SAVE EXPLORED POINT
========================================================= */

function saveExploredPointIfNeeded(
    lat,
    lng,
    radius,
    force = false
) {

    /*
        Radius 0 means:
        player can see only
        their exact position.

        No meaningful area
        is permanently revealed.
    */

    if (radius <= 0) {

        return;

    }


    /*
        First point.
    */

    if (!lastSavedZone) {

        addExploredZone(
            lat,
            lng,
            radius
        );

        return;

    }


    /*
        Distance from previous
        stored exploration point.
    */

    const distance =
        getDistance(

            lastSavedZone.lat,

            lastSavedZone.lng,

            lat,

            lng

        );


    /*
        We don't need thousands
        of overlapping circles.

        Save another point after
        moving roughly 25% of
        current visibility radius.

        Minimum = 5 m.
    */

    const saveDistance =
        Math.max(
            5,
            radius * 0.25
        );


    /*
        Also save if radius increased.

        Example:
        night -> flashlight ON
    */

    const radiusIncreased =
        radius >
        lastSavedZone.radius;


    if (
        force ||
        distance >= saveDistance ||
        radiusIncreased
    ) {

        addExploredZone(
            lat,
            lng,
            radius
        );

    }

}


/* =========================================================
   ADD EXPLORED ZONE
========================================================= */

function addExploredZone(
    lat,
    lng,
    radius
) {

    const zone = {

        lat:
            Number(
                lat.toFixed(6)
            ),

        lng:
            Number(
                lng.toFixed(6)
            ),

        radius:
            Math.round(
                radius
            )

    };


    exploredZones.push(
        zone
    );


    lastSavedZone =
        zone;


    /*
        MVP protection against
        endlessly growing LocalStorage.

        Keep latest 5000 circles.

        Later this should be replaced
        by merged polygons / server DB.
    */

    const MAX_ZONES =
        5000;


    if (
        exploredZones.length >
        MAX_ZONES
    ) {

        exploredZones =
            exploredZones.slice(
                -MAX_ZONES
            );

    }


    try {

        localStorage.setItem(

            EXPLORED_STORAGE_KEY,

            JSON.stringify(
                exploredZones
            )

        );

    }
    catch (error) {

        console.error(
            "LocalStorage full:",
            error
        );

    }


    drawFog();

}


/* =========================================================
   FOG CANVAS SIZE
========================================================= */

function resizeFogCanvas() {

    /*
        DevicePixelRatio makes
        circle edges sharper
        on phone screens.
    */

    const ratio =
        window.devicePixelRatio ||
        1;


    fogCanvas.width =
        Math.floor(
            window.innerWidth *
            ratio
        );


    fogCanvas.height =
        Math.floor(
            window.innerHeight *
            ratio
        );


    fogCanvas.style.width =
        window.innerWidth +
        "px";


    fogCanvas.style.height =
        window.innerHeight +
        "px";


    fogContext.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawFog();

}


/* =========================================================
   METERS -> SCREEN PIXELS
========================================================= */

/*
    Leaflet knows geographic
    projection.

    We take a geographic point,
    calculate another point
    X meters east,
    then measure pixel distance.

    This gives accurate screen
    radius for current zoom.
*/

function metersToPixels(
    lat,
    lng,
    meters
) {

    if (
        !map ||
        meters <= 0
    ) {

        return 0;

    }


    /*
        Approximate longitude
        degrees per meter.
    */

    const latitudeRadians =
        lat *
        Math.PI /
        180;


    const metersPerDegreeLongitude =
        111320 *
        Math.cos(
            latitudeRadians
        );


    if (
        Math.abs(
            metersPerDegreeLongitude
        ) < 0.0001
    ) {

        return 0;

    }


    const longitudeOffset =
        meters /
        metersPerDegreeLongitude;


    const centerPoint =
        map.latLngToContainerPoint(
            [lat, lng]
        );


    const edgePoint =
        map.latLngToContainerPoint(
            [
                lat,
                lng +
                longitudeOffset
            ]
        );


    return Math.abs(
        edgePoint.x -
        centerPoint.x
    );

}


/* =========================================================
   DRAW FOG
========================================================= */

function drawFog() {

    if (!map) {
        return;
    }


    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    /*
        Reset composition.
    */

    fogContext
        .globalCompositeOperation =
            "source-over";


    fogContext.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Black translucent fog.
    */

    fogContext.fillStyle =
        "rgba(0, 0, 0, 0.90)";


    fogContext.fillRect(
        0,
        0,
        width,
        height
    );


    /*
        Everything drawn now
        CUTS holes from the fog.
    */

    fogContext
        .globalCompositeOperation =
            "destination-out";


    /*
        =================================
        PERMANENTLY EXPLORED AREAS
        =================================
    */

    for (
        let i = 0;
        i < exploredZones.length;
        i++
    ) {

        const zone =
            exploredZones[i];


        drawVisibilityHole(

            zone.lat,

            zone.lng,

            zone.radius,

            false

        );

    }


    /*
        =================================
        CURRENT PLAYER VISION
        =================================
    */

    if (currentPosition) {

        const radius =
            getCurrentVisionRadius();


        /*
            Radius 0:

            create only tiny
            visual hole under player.
        */

        if (radius <= 0) {

            drawTinyPlayerHole(

                currentPosition.lat,

                currentPosition.lng

            );

        }
        else {

            drawVisibilityHole(

                currentPosition.lat,

                currentPosition.lng,

                radius,

                true

            );

        }

    }


    /*
        Restore normal drawing.
    */

    fogContext
        .globalCompositeOperation =
            "source-over";

}


/* =========================================================
   DRAW VISIBILITY CIRCLE
========================================================= */

function drawVisibilityHole(
    lat,
    lng,
    radiusMeters,
    current
) {

    const point =
        map.latLngToContainerPoint(
            [lat, lng]
        );

    const radiusPixels =
        metersToPixels(
            lat,
            lng,
            radiusMeters
        );

    /*
        Не малюємо кола, які повністю
        знаходяться за межами екрана.
    */

    if (
        point.x + radiusPixels < 0 ||
        point.y + radiusPixels < 0 ||
        point.x - radiusPixels > window.innerWidth ||
        point.y - radiusPixels > window.innerHeight
    ) {
        return;
    }

    /*
        Простий прозорий отвір у тумані.
        Без градієнта, кольорових зон
        або напівпрозорого краю.
    */

    fogContext.fillStyle =
        "rgba(0,0,0,1)";

    fogContext.beginPath();

    fogContext.arc(
        point.x,
        point.y,
        radiusPixels,
        0,
        Math.PI * 2
    );

    fogContext.fill();
}


/* =========================================================
   NIGHT CITY — RADIUS 0
========================================================= */

function drawTinyPlayerHole(
    lat,
    lng
) {

    const point =
        map.latLngToContainerPoint(
            [lat, lng]
        );


    /*
        Tiny opening around
        player's marker.

        Game logic radius remains 0 m.
    */

    const radius =
        8;


    fogContext.beginPath();

    fogContext.arc(

        point.x,

        point.y,

        radius,

        0,

        Math.PI * 2

    );

    fogContext.fill();

}


/* =========================================================
   SPEED
========================================================= */

function calculateSpeed(
    position
) {

    /*
        Native GPS speed,
        if provided.
    */

    if (
        position.coords.speed !== null &&
        position.coords.speed >= 0
    ) {

        previousPosition =
            position;

        return (
            position.coords.speed *
            3.6
        );

    }


    /*
        Calculate manually.
    */

    if (!previousPosition) {

        previousPosition =
            position;

        return 0;

    }


    const distance =
        getDistance(

            previousPosition
                .coords
                .latitude,

            previousPosition
                .coords
                .longitude,

            position
                .coords
                .latitude,

            position
                .coords
                .longitude

        );


    const timeDifference =

        (
            position.timestamp -
            previousPosition.timestamp
        ) / 1000;


    previousPosition =
        position;


    if (
        timeDifference <= 0
    ) {

        return 0;

    }


    let speed =
        (
            distance /
            timeDifference
        ) * 3.6;


    /*
        Remove small GPS drift.
    */

    if (speed < 1) {

        speed = 0;

    }


    return speed;

}


/* =========================================================
   HAVERSINE DISTANCE
========================================================= */

/*
    Returns distance in METERS
    between two GPS coordinates.
*/

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const earthRadius =
        6371000;


    const toRadians =
        value =>
            value *
            Math.PI /
            180;


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =

        Math.sin(
            dLat / 2
        ) *

        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            toRadians(lat1)
        ) *

        Math.cos(
            toRadians(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) *

        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return (
        earthRadius *
        c
    );

}


/* =========================================================
   GPS ERROR
========================================================= */

function handleGPSError(
    error
) {

    let message =
        "Помилка GPS";


    switch (
        error.code
    ) {

        case error.PERMISSION_DENIED:

            message =
                "Немає дозволу на геолокацію";

            break;


        case error.POSITION_UNAVAILABLE:

            message =
                "GPS-позиція недоступна";

            break;


        case error.TIMEOUT:

            message =
                "GPS не відповідає";

            break;

    }


    gpsStatus.textContent =
        message;

}


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function () {

        resizeFogCanvas();

        if (map) {

            map.invalidateSize();

        }

    }
);


/* =========================================================
   TIME CHECK
========================================================= */

/*
    Time can change while game
    remains open.

    Check once per minute.
*/

setInterval(
    function () {

        updateHUD();

        drawFog();

    },
    60000
);


/* =========================================================
   INIT
========================================================= */

checkLogin();

</script>
